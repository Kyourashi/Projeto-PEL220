# ==================================================================================
#  PEL220 - Projeto do grupo: estufa agrícola inteligente (cultura: alface)
# ----------------------------------------------------------------------------------
#  O Docker Compose lê este arquivo junto com o docker-compose.yml da Base, sozinho,
#  em todo "docker compose …" rodado nesta pasta. Assim a Base do professor fica
#  intacta e a estufa entra na mesma rede (fiware_default) e nos mesmos volumes.
#
#  Ordem (README de estufa/):
#    docker compose up -d --wait orion
#    docker compose up -d --wait iot-agent
#    docker compose up -d --wait cygnus
#    python3 ../estufa/configurar.py          # estufa, provisionamento e subscrições
#    docker compose up -d --build esp32-estufa
#    docker compose up -d --build gravador-clima
#    docker compose up -d grafana-estufa      # http://localhost:3002
# ==================================================================================

services:
  # --- Correção para o Codespace ----------------------------------------------------
  orion:
    # O Orion grava /tmp/contextBroker.pid e se recusa a subir se o arquivo sobrar de um
    # desligamento brusco (o Codespace que para sozinho): "PID-file ... found. A broker seems
    # to be running already" e exit 1. Com o /tmp em memória, o arquivo some a cada partida.
    tmpfs:
      - /tmp

  # --- O nó da estufa (tenant estufa) ---------------------------------------------
  esp32-estufa:
    # DHT22, sensor de solo, BH1750, ultrassom da caixa, medidor de vazão e dois relés, em software. Acompanhe: docker logs -f esp32-estufa
    build: ../estufa/esp32_estufa
    image: pel220/esp32-estufa
    container_name: esp32-estufa
    depends_on:
      - mosquitto
    environment:
      - DEVICE_ID=estufa001
      - APIKEY=estufa
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - INTERVALO=5
      - LIGA_VENT=24        # os limites da AgriGreenhouse:001 (fanOnTemperature …), para alface
      - DESLIGA_VENT=22
      - LIGA_BOMBA=30
      - DESLIGA_BOMBA=45
      - PERIODO_LUZ=600     # um "dia" simulado dura 10 min
      - PICO_LUX=34000      # luz ao meio-dia dentro da estufa (premissa da simulação)
      - CAIXA_LITROS=500    # caixa d'água (tankCapacity no dispositivo.json)
      - VAZAO_LPM=18        # vazão da bomba no gotejamento (premissa)
      - BOIA_LPM=3          # reposição pela boia, da rede (premissa)

  # --- O clima externo no histórico (tenant estufa) ---------------------------------
  gravador-clima:
    # A cada 15 min, lê o clima-externo da Base e grava a WeatherObserved:FEI no Orion.
    # A subscrição "Clima externo para o Cygnus" leva cada leitura ao MySQL.
    # Substitui o registro: no tenant estufa, o clima NÃO tem registro (seriam duas fontes).
    build: ../estufa/gravador_clima
    image: pel220/gravador-clima
    container_name: gravador-clima
    depends_on:
      - orion
      - clima-externo
    environment:
      - PROVEDOR=http://clima-externo:3010/v2
      - ORION=http://orion:1026
      - FIWARE_SERVICE=estufa
      - FIWARE_SERVICEPATH=/
      - INTERVALO=900       # a Open-Meteo atualiza o "current" a cada 15 min
      - LATITUDE=-23.7245   # FEI, São Bernardo do Campo (as mesmas do clima-externo)
      - LONGITUDE=-46.5793

  # --- A estufa em 3D: o "agora" lido do Orion -------------------------------------
  estufa-3d:
    # http://localhost:3003 · Three.js no navegador; o servidor lê o Orion a cada pedido da página.
    build: ../estufa/estufa_3d
    image: pel220/estufa-3d
    container_name: estufa-3d
    depends_on:
      - orion
    ports:
      - "3003:3003"
    environment:
      - ORION=http://orion:1026
      - FIWARE_SERVICE=estufa
      - FIWARE_SERVICEPATH=/
      - PORTA=3003

  # --- O painel do grupo (marco da Aula 8) -----------------------------------------
  grafana-estufa:
    # http://localhost:3002 abre direto no painel da estufa (visitante só lê; admin/admin para editar).
    # Fonte de dados e painel carregados por provisionamento (estufa/grafana/).
    image: grafana/grafana:10.4.0
    hostname: grafana-estufa
    container_name: grafana-estufa
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "3002:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/paineis/painel_estufa.json
    volumes:
      - ../estufa/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../estufa/grafana/paineis:/etc/grafana/paineis:ro
