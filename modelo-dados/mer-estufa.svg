<text x="40" y="842" font-size="14" fill="#2D3748"><tspan font-weight="bold">Unidades:</tspan> metadado unitCode (UN/CEFACT): CEL = °C · P1 = % · MTK = m²  ·  Device é escrito pelo IoT Agent; AgriGreenhouse, pela aplicação</text>
